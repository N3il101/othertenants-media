<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fit Together</title>
<meta name="description" content="Neil & Rachna's fitness command center">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fit Together">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style id="css">
:root{
  color-scheme:light;
  --bg:#f3f6f2; --surface:#fdfdfc; --surface2:#ecf0ea; --ink:#151815; --ink2:#4d554f; --muted:#848d86;
  --line:#e2e7e0; --hair:#d6dcd4;
  --pa:#4a3aa7; --pb:#bf7e00;
  --pa-soft:rgba(74,58,167,.11); --pb-soft:rgba(191,126,0,.13);
  --good:#0ca30c; --good-text:#006300; --warn:#c98500; --bad:#d03b3b; --cell:#e6ebe4;
  --shadow:0 1px 2px rgba(21,24,21,.05),0 10px 28px rgba(21,24,21,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1210; --surface:#181c19; --surface2:#212622; --ink:#f1f4f1; --ink2:#bfc6c0; --muted:#8a938c;
    --line:#282e29; --hair:#333a34;
    --pa:#9085e9; --pb:#c98500;
    --pa-soft:rgba(144,133,233,.17); --pb-soft:rgba(201,133,0,.17);
    --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --bad:#e66767; --cell:#232823;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1210; --surface:#181c19; --surface2:#212622; --ink:#f1f4f1; --ink2:#bfc6c0; --muted:#8a938c;
  --line:#282e29; --hair:#333a34;
  --pa:#9085e9; --pb:#c98500;
  --pa-soft:rgba(144,133,233,.17); --pb-soft:rgba(201,133,0,.17);
  --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --bad:#e66767; --cell:#232823;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:86px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pa);outline-offset:2px;border-radius:6px}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--hair);border-radius:9px;padding:7px 10px;max-width:100%}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--pc,var(--pa));width:130px}
input[type=time]{padding:5px 8px}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
.logo{display:flex;align-items:center;gap:10px}
.logomark{flex:none}
.wordmark{font-family:Anton,Barlow,sans-serif;font-size:22px;letter-spacing:.04em;line-height:1}
.wordmark small{display:block;font-family:Barlow;font-size:9.5px;font-weight:700;letter-spacing:.22em;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-good{background:var(--good)} .dot-muted{background:var(--muted)} .dot-a{background:var(--pa)} .dot-b{background:var(--pb)}
.view{animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .view{animation:none} .ringwrap circle,.stepbtn,.bar-anim{transition:none !important;transform:none !important} }
section{margin:22px 0 0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 9px}
.eyebrow .legend{display:flex;gap:10px;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.a{--pc:var(--pa);--pc-soft:var(--pa-soft)} .b{--pc:var(--pb);--pc-soft:var(--pb-soft)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 2px;border-radius:10px}
.tabbar button .ti{font-size:19px;line-height:1}
.tabbar button.on{color:var(--ink);background:var(--surface2)}
/* segmented control */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--hair);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 18px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.pa{color:var(--pa)} .seg button.on.pb{color:var(--pb)}
/* today hero */
.herogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pcard{padding:16px;border-top:3px solid var(--pc)}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pname{font-weight:800;font-size:17px;display:flex;align-items:center;gap:7px}
.pname .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.lvl{font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--surface2);padding:3px 9px;border-radius:99px}
.scorewrap{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;flex:none}
.ringwrap circle{transition:stroke-dashoffset .5s ease}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:Anton,Barlow,sans-serif;letter-spacing:.02em}
.ringnum .rn{font-size:30px} .ringnum small{display:block;font-family:Barlow;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.ministats{display:grid;gap:5px;font-size:13.5px;color:var(--ink2);min-width:0;flex:1}
.ministats .ms{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ministats b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ministats .hit{color:var(--good-text)}
.pfoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.minichip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pc-soft);color:var(--ink)}
.minichip.grey{background:var(--surface2);color:var(--ink2)}
.hero{padding:18px 16px;text-align:center}
.hlabel{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.bignum{font-family:Anton,Barlow,sans-serif;font-size:58px;line-height:1;letter-spacing:.01em}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 2px}
.vs .side{flex:1;max-width:190px}
.vs .side.a .bignum{color:var(--pa)} .vs .side.b .bignum{color:var(--pb)}
.vs .who{font-weight:700;font-size:14px;margin-top:4px}
.vs .dash{font-family:Anton,Barlow,sans-serif;font-size:28px;color:var(--muted)}
.hsub{font-size:12.5px;color:var(--muted);margin-top:6px}
.leadchip{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:5px 13px;border-radius:99px;background:var(--surface2)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink2);margin:0 0 12px}
.banner.blue{border-left-color:var(--pa)}
.banner b{color:var(--ink)}
.remain{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.remain .chip{font-size:12.5px}
.insight{border-left:3px solid var(--hair);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:8px}
.insight.a{border-left-color:var(--pa)} .insight.b{border-left-color:var(--pb)} .insight.c{border-left-color:var(--good)}
.insight b{font-weight:700}
.inscard{padding:14px 14px 7px}
/* check-in */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}
.daynav .dlabel{font-weight:700;font-size:15px;text-align:center}
.daynav .dlabel small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.navbtn{width:38px;height:34px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);font-size:16px;display:grid;place-items:center}
.navbtn[disabled]{opacity:.35;cursor:default}
.todaybtn{font-size:12.5px;font-weight:700;color:var(--pa);padding:2px 6px}
.cihead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dtog{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink2)}
.switch{width:40px;height:23px;border-radius:99px;background:var(--surface2);border:1px solid var(--hair);position:relative}
.switch i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch.on{background:var(--pc-soft);border-color:var(--pc)}
.switch.on i{left:19px;background:var(--pc)}
.cicard{padding:14px;margin-bottom:12px}
.cicard h3{margin:0 0 4px;font-size:14.5px;display:flex;align-items:center;gap:7px}
.cicard h3 .sub{font-weight:500;font-size:12px;color:var(--muted);margin-left:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:none}
.rlabel{font-size:13px;font-weight:600;color:var(--ink2);min-width:70px}
.rlabel small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.stepper{display:flex;align-items:center;gap:9px}
.stepbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--surface2);font-size:19px;font-weight:600;display:grid;place-items:center;transition:transform .08s}
.stepbtn:active{transform:scale(.92)}
.stepval{font-weight:800;font-size:18px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.stepval small{font-size:11px;color:var(--muted);font-weight:600;display:block}
.pbar{height:7px;border-radius:99px;background:var(--cell);overflow:hidden;flex:1;min-width:60px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--pc);transition:width .3s ease}
.pbar.over i{background:var(--good)}
.numin{width:88px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.slrow{display:flex;align-items:center;gap:10px}
.slval{font-size:12.5px;font-weight:700;color:var(--ink2);min-width:64px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.chipbtn{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--hair);background:var(--surface);color:var(--ink2)}
.chipbtn.on{background:var(--pc-soft);border-color:var(--pc);color:var(--ink)}
.hchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:4px 0}
.hchip{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:11px;border:1px solid var(--hair);background:var(--surface);color:var(--ink2);text-align:left}
.hchip .tick{width:17px;height:17px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:11px;color:transparent;flex:none}
.hchip.on{background:var(--pc-soft);border-color:var(--pc);color:var(--ink)}
.hchip.on .tick{background:var(--pc);border-color:var(--pc);color:#fff}
.gymtog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:8px 13px;border-radius:11px;border:1px solid var(--hair);background:var(--surface2)}
.gymtog.on{background:var(--pc-soft);border-color:var(--pc)}
.gymtog .tick{width:16px;height:16px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-size:11px;color:transparent;flex:none}
.gymtog.on .tick{background:var(--pc);border-color:var(--pc);color:#fff}
.exgrid{display:grid;grid-template-columns:minmax(90px,2fr) 52px 52px 68px 30px;gap:6px;align-items:center;margin-top:6px}
.exgrid input{padding:6px 8px;font-size:13.5px}
.exgrid .exhead{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.exdel{color:var(--muted);font-size:16px;text-align:center}
.addrow{font-size:12.5px;font-weight:700;color:var(--pc,var(--pa));padding:7px 2px}
.notein{width:100%;margin-top:4px}
/* train */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.stattile{padding:12px 13px;text-align:center}
.stattile .tv{font-family:Anton,Barlow,sans-serif;font-size:24px;letter-spacing:.02em}
.stattile .tl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.wklist{display:grid;gap:8px}
.wkitem{display:flex;align-items:center;gap:10px;padding:11px 13px}
.wkitem .wdate{font-size:11.5px;font-weight:700;color:var(--muted);min-width:52px;text-align:center;line-height:1.25}
.wkitem .winfo{flex:1;min-width:0}
.wkitem .wtitle{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.wkitem .wsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkitem .wact{display:flex;gap:2px}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.iconbtn:hover{background:var(--surface2)}
.primbtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;background:var(--pc-soft,var(--pa-soft));border:1px solid var(--pc,var(--pa))}
.ghostbtn{font-size:13px;font-weight:700;padding:8px 13px;border-radius:10px;border:1px solid var(--hair);background:var(--surface2);color:var(--ink2)}
.ghostbtn.warn{color:var(--bad);border-color:var(--bad)}
.prlist{display:grid;gap:7px}
.pritem{display:flex;align-items:baseline;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.pritem:first-child{border-top:none}
.pritem b{font-variant-numeric:tabular-nums}
.pritem .prd{margin-left:auto;font-size:12px;color:var(--muted)}
.prnew{font-size:10.5px;font-weight:800;color:var(--good-text);letter-spacing:.05em}
/* charts */
.chartcard{padding:14px}
.charttitle{font-weight:700;font-size:14.5px;margin:0 0 2px}
.chartsub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;gap:12px}
@media(min-width:720px){ .grid2{grid-template-columns:1fr 1fr} .grid2 .span2{grid-column:1/-1} }
svg{display:block}
svg text{font-family:Barlow,system-ui,sans-serif}
.axis{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--hair);stroke-width:1}
.empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.hmwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.hm{padding:13px 14px}
.hm h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.hm h4 .dot{width:8px;height:8px;border-radius:50%;flex:none}
.hmgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;justify-content:start}
.hmgrid .c{width:13px;height:13px;border-radius:3.5px;background:var(--cell)}
.hm.a .c[data-l="1"]{background:color-mix(in srgb,var(--pa) 25%,var(--surface))}
.hm.a .c[data-l="2"]{background:color-mix(in srgb,var(--pa) 45%,var(--surface))}
.hm.a .c[data-l="3"]{background:color-mix(in srgb,var(--pa) 68%,var(--surface))}
.hm.a .c[data-l="4"]{background:var(--pa)}
.hm.b .c[data-l="1"]{background:color-mix(in srgb,var(--pb) 25%,var(--surface))}
.hm.b .c[data-l="2"]{background:color-mix(in srgb,var(--pb) 45%,var(--surface))}
.hm.b .c[data-l="3"]{background:color-mix(in srgb,var(--pb) 68%,var(--surface))}
.hm.b .c[data-l="4"]{background:var(--pb)}
.hmgrid .c.future{opacity:0}
.hmfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}
/* review */
.repcard{padding:16px}
.repcard h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.repscore{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}
.repscore .rs{font-family:Anton,Barlow,sans-serif;font-size:40px}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--good-text)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0;font-size:13.5px;color:var(--ink2)}
.repgrid b{color:var(--ink);font-variant-numeric:tabular-nums}
.repblock{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px}
.repblock .rbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.repblock .rbl.win{color:var(--good-text)} .repblock .rbl.work{color:var(--warn)} .repblock .rbl.gap{color:var(--bad)} .repblock .rbl.next{color:var(--pa)}
.repblock ol{margin:4px 0 0;padding-left:20px}
.cmprow{display:grid;grid-template-columns:1fr 92px;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.cmprow:first-of-type{border-top:none}
.cmprow .cl{color:var(--ink2)}
.cmpbars{grid-column:1/-1;display:grid;gap:3px}
.cmpbar{display:flex;align-items:center;gap:8px;font-size:12.5px}
.cmpbar .pbar{max-width:none}
.cmpbar b{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.ach{padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--surface);text-align:center}
.ach .ai{font-size:24px}
.ach .an{font-weight:800;font-size:13px;margin-top:4px}
.ach .ad{font-size:11.5px;color:var(--muted);margin-top:2px}
.ach.locked{opacity:.55;filter:grayscale(.9)}
.ach.got{border-color:var(--good);box-shadow:var(--shadow)}
.ach .when{font-size:10.5px;font-weight:700;color:var(--good-text);margin-top:4px}
.goalitem{padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.goalitem:first-of-type{border-top:none}
.goalhead{display:flex;align-items:center;gap:8px}
.goalhead .gt{font-weight:700}
.goalhead .gs{margin-left:auto;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px}
.gs.ontrack{background:var(--pa-soft);color:var(--ink)} .gs.behind{background:var(--pb-soft)} .gs.done{background:var(--good);color:#fff}
.goalsub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.goalbar{display:flex;align-items:center;gap:9px;margin-top:6px}
.goalbar .pbar{height:8px}
.goalbar b{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

<script id="app">
(function(){
'use strict';
var LS='fit-together-v2';
var MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Glutes','Core','Full Body'];
var WTYPES=[['strength','🏋️ Strength'],['cardio','🏃 Cardio'],['sport','⚽ Sport'],['mobility','🧘 Mobility'],['other','✨ Other']];
var WLOCS=[['gym','Gym'],['home','Home'],['outdoor','Outdoor']];
var TYPELBL={}; WTYPES.forEach(function(x){TYPELBL[x[0]]=x[1];});
var LOCLBL={}; WLOCS.forEach(function(x){LOCLBL[x[0]]=x[1];});
var QLBL=['Rough','Poor','OK','Good','Great'];
var ILBL=['Easy','Moderate','Hard'];
var MLBL=['Drained','Low','OK','Good','Energized'];
var POINTS=[['Workout logged',10],['Step goal',5],['Water goal',5],['Protein goal',5],['Sleep goal',5],['Outdoor workout',5],['All habits done',5],['Mobility / stretch',3]];
var S=JSON.parse(document.getElementById('state').textContent);
var viewIso=iso(new Date());
var curTab='today', curP='a', detailed=false, exOpen=false, wDraft=null, gDraft=null, gFormOpen=false;
var pubTimer=null, saveMode='boot', clearArmed=false, silentAch=false;

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fromIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function niceDate(s){return fromIso(s).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});}
function shortDate(s){return fromIso(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function rangeIso(n,end){var out=[],i,e=end?fromIso(end):new Date();for(i=n-1;i>=0;i--)out.push(iso(addDays(e,-i)));return out;}
function todayIso(){return iso(new Date());}

/* ---------- formatting ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmtL(ml){return (Math.round(ml/50)*50/1000).toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'L';}
function fmtH(h){if(!h&&h!==0)return '—';var hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'h'+(mm?' '+String(mm).padStart(2,'0')+'m':'');}
function num(n){return (n||0).toLocaleString();}
function pct(x){return Math.round(x*100)+'%';}

/* ---------- state plumbing ---------- */
function stableStr(o){
  if(o===null||typeof o!=='object')return JSON.stringify(o);
  if(Array.isArray(o))return '['+o.map(stableStr).join(',')+']';
  return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+stableStr(o[k]);}).join(',')+'}';
}
function mergeById(baseArr,overArr){
  var by={};(baseArr||[]).forEach(function(i){by[i.id]=i;});
  (overArr||[]).forEach(function(i){if(!by[i.id]||(i.t||0)>(by[i.id].t||0))by[i.id]=i;});
  return Object.keys(by).map(function(k){return by[k];}).sort(function(x,y){return (x.c||0)-(y.c||0)||String(x.id).localeCompare(String(y.id));});
}
function mergeStates(base,over){
  var m=JSON.parse(JSON.stringify(base)),d,p;
  ['a','b'].forEach(function(k){
    if(over.people&&over.people[k]&&(over.people[k].t||0)>(m.people[k].t||0))m.people[k]=over.people[k];
    m.habits[k]=mergeById(m.habits[k],(over.habits||{})[k]);
  });
  for(d in (over.days||{})){m.days[d]=m.days[d]||{};
    for(p in over.days[d]){if((over.days[d][p].t||0)>((m.days[d][p]||{}).t||0))m.days[d][p]=over.days[d][p];}}
  m.workouts=mergeById(m.workouts,over.workouts);
  m.measure=mergeById(m.measure,over.measure);
  m.goals=mergeById(m.goals,over.goals);
  ['a','b','c'].forEach(function(k){var oa=(over.ach||{})[k]||{},key;
    for(key in oa){if(!m.ach[k][key]||oa[key]<m.ach[k][key])m.ach[k][key]=oa[key];}});
  if(over.cfg&&(over.cfg.t||0)>(m.cfg.t||0))m.cfg=over.cfg;
  if(over.sample)m.sample=over.sample;
  return m;
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function mut(fn){fn();checkAch();persistLocal();render();schedulePublish();}
function ent(dIso,p){return (S.days[dIso]||{})[p]||{};}
function patchEnt(dIso,p,patch){
  mut(function(){S.days[dIso]=S.days[dIso]||{};var e=S.days[dIso][p]||{};
    Object.keys(patch).forEach(function(k){e[k]=patch[k];});e.t=Date.now();S.days[dIso][p]=e;});
}
function G(p){var g=S.people[p]||{};return {water:g.waterGoal||2500,sleep:g.sleepGoal||8,steps:g.stepGoal||8000,active:g.activeGoal||30,prot:g.protGoal||120,veg:g.vegGoal||3,wpw:g.workoutGoal||4};}
function pname(p){return S.people[p].name;}
function habitsOf(p){return (S.habits[p]||[]).filter(function(h){return !h.del&&h.on;});}
function workoutsOn(dIso,p){return S.workouts.filter(function(w){return !w.del&&w.p===p&&w.date===dIso;});}
function workoutsRange(p,days){var from=iso(addDays(new Date(),-(days-1)));
  return S.workouts.filter(function(w){return !w.del&&w.p===p&&w.date>=from&&w.date<=todayIso();});}
function measuresOf(p){return S.measure.filter(function(m){return !m.del&&m.p===p;}).sort(function(x,y){return x.date<y.date?-1:1;});}
function anyData(){return Object.keys(S.days).length>0||S.workouts.some(function(w){return !w.del;});}
function firstLogIso(){var min=todayIso(),k;for(k in S.days){if(k<min)min=k;}
  S.workouts.forEach(function(w){if(!w.del&&w.date<min)min=w.date;});return min;}
function stretchDone(dIso,p){
  var e=ent(dIso,p),hs=habitsOf(p).filter(function(h){return /stretch|mobility|yoga/i.test(h.label);});
  if(hs.some(function(h){return e.habits&&e.habits[h.id];}))return true;
  return workoutsOn(dIso,p).some(function(w){return w.type==='mobility';});
}
function habitStats(dIso,p){var e=ent(dIso,p),hs=habitsOf(p),done=0;
  hs.forEach(function(h){if(e.habits&&e.habits[h.id])done++;});
  return {done:done,total:hs.length};}

/* ---------- scoring ---------- */
function weights(){var w=S.cfg.weights,sum=0,k;for(k in w)sum+=(+w[k]||0);if(!sum)sum=1;
  var out={};for(k in w)out[k]=(+w[k]||0)/sum*100;return out;}
function logged(dIso,p){return !!ent(dIso,p).t||workoutsOn(dIso,p).length>0;}
function weekPace(dIso,p){
  var g=G(p),mon=iso(mondayOf(fromIso(dIso))),n=0,i,d;
  for(i=0;i<7;i++){d=iso(addDays(fromIso(mon),i));if(d>dIso)break;if(workoutsOn(d,p).length)n++;}
  var elapsed=Math.round((fromIso(dIso)-fromIso(mon))/864e5)+1;
  return n>=Math.min(g.wpw,Math.ceil(g.wpw*elapsed/7))-0; }
function comps(dIso,p){
  var e=ent(dIso,p),g=G(p),w=weights(),wk=workoutsOn(dIso,p);
  var sleepPct=Math.min(1,(e.sleep||0)/g.sleep);
  var sq=e.sq?e.sq/5:(e.sleep?0.6:0);
  var out={};
  out.sleep=w.sleep*(0.75*sleepPct+0.25*sq);
  out.activity=w.activity*(0.7*Math.min(1,(e.steps||0)/g.steps)+0.3*Math.min(1,(e.active||0)/g.active));
  if(wk.length)out.exercise=w.exercise;
  else if(weekPace(dIso,p))out.exercise=w.exercise*0.7;
  else out.exercise=w.exercise*((e.active||0)>=30?0.25:0);
  out.hydration=w.hydration*Math.min(1,(e.w||0)/g.water);
  out.nutrition=w.nutrition*(0.6*Math.min(1,(e.prot||0)/g.prot)+0.4*Math.min(1,(e.veg||0)/g.veg));
  out.recovery=w.recovery*(0.5*(e.sq?e.sq/5:0.4)+0.5*(stretchDone(dIso,p)?1:0.35));
  var hb=habitStats(dIso,p);
  out.habits=w.habits*(hb.total?hb.done/hb.total:1);
  return out;
}
function score(dIso,p){
  if(!logged(dIso,p))return null;
  var c=comps(dIso,p),s=0,k;for(k in c)s+=c[k];
  return Math.max(0,Math.min(100,Math.round(s)));
}
function coupleScore(dIso){var a=score(dIso,'a'),b=score(dIso,'b');
  if(a===null&&b===null)return null;if(a===null)return b;if(b===null)return a;return Math.round((a+b)/2);}

/* ---------- points / XP ---------- */
function dayPoints(dIso,p){
  if(!logged(dIso,p))return 0;
  var e=ent(dIso,p),g=G(p),wk=workoutsOn(dIso,p),pts=0;
  if(wk.length)pts+=10;
  if((e.steps||0)>=g.steps)pts+=5;
  if((e.w||0)>=g.water)pts+=5;
  if((e.prot||0)>=g.prot)pts+=5;
  if((e.sleep||0)>=g.sleep)pts+=5;
  if(wk.some(function(x){return x.loc==='outdoor';}))pts+=5;
  var hb=habitStats(dIso,p);
  if(hb.total&&hb.done===hb.total)pts+=5;
  if(stretchDone(dIso,p))pts+=3;
  return pts;
}
function weekPoints(p,monIso){
  var pts=0,i,d;for(i=0;i<7;i++){d=iso(addDays(fromIso(monIso),i));if(d>todayIso())break;pts+=dayPoints(d,p);}
  return pts;
}
function xp(p){var from=firstLogIso(),d=fromIso(from),pts=0;
  while(iso(d)<=todayIso()){pts+=dayPoints(iso(d),p);d=addDays(d,1);}return pts;}
function level(x){return Math.floor(x/150)+1;}

/* ---------- streaks ---------- */
var METRICS={
  workout:{lbl:'workout',icon:'🏋️',hit:function(d,p){return workoutsOn(d,p).length>0;}},
  water:{lbl:'hydration',icon:'💧',hit:function(d,p){return (ent(d,p).w||0)>=G(p).water;}},
  protein:{lbl:'protein',icon:'🥩',hit:function(d,p){return (ent(d,p).prot||0)>=G(p).prot;}},
  steps:{lbl:'steps',icon:'🚶',hit:function(d,p){return (ent(d,p).steps||0)>=G(p).steps;}},
  sleep:{lbl:'sleep',icon:'😴',hit:function(d,p){return (ent(d,p).sleep||0)>=G(p).sleep;}},
  log:{lbl:'check-in',icon:'✅',hit:function(d,p){return logged(d,p);}}
};
function streak(p,key){
  var hit=METRICS[key].hit,cur=0,longest=0,run=0;
  var d=new Date();
  if(!hit(iso(d),p))d=addDays(d,-1); /* an unfinished today never breaks a streak */
  while(hit(iso(d),p)){cur++;d=addDays(d,-1);}
  var s=fromIso(firstLogIso()),end=todayIso();
  while(iso(s)<=end){if(hit(iso(s),p)){run++;if(run>longest)longest=run;}else run=0;s=addDays(s,1);}
  return {cur:cur,longest:longest};
}
function bestStreak(p){
  var best=null;['workout','water','protein','steps','sleep'].forEach(function(k){
    var st=streak(p,k);if(st.cur>=2&&(!best||st.cur>best.cur))best={k:k,cur:st.cur};});
  return best;
}

/* ---------- aggregations ---------- */
function avgOf(arr){var v=arr.filter(function(x){return x!==null&&x!==undefined&&!isNaN(x);});
  if(!v.length)return null;return v.reduce(function(a,x){return a+x;},0)/v.length;}
function muscleCounts(p,days){
  var c={};MUSCLES.forEach(function(m){c[m]=0;});
  workoutsRange(p,days).forEach(function(w){(w.muscles||[]).forEach(function(m){if(c[m]!==undefined)c[m]++;});});
  return c;
}
function daysSinceWorkout(p,pred){
  var ws=S.workouts.filter(function(w){return !w.del&&w.p===p&&pred(w);}).map(function(w){return w.date;}).sort();
  if(!ws.length)return null;
  return Math.round((fromIso(todayIso())-fromIso(ws[ws.length-1]))/864e5);
}
function exSessions(p){
  var by={};
  S.workouts.filter(function(w){return !w.del&&w.p===p;}).forEach(function(w){
    (w.exercises||[]).forEach(function(x){
      if(!x.n||!(+x.kg>0))return;
      var k=x.n.trim().toLowerCase();if(!k)return;
      by[k]=by[k]||{name:x.n.trim(),sess:{}};
      var kg=+x.kg;if(!by[k].sess[w.date]||kg>by[k].sess[w.date])by[k].sess[w.date]=kg;
    });
  });
  var out={};Object.keys(by).forEach(function(k){
    out[k]={name:by[k].name,pts:Object.keys(by[k].sess).sort().map(function(d){return {d:d,v:by[k].sess[d]};})};});
  return out;
}
function prList(p){
  var ex=exSessions(p),out=[];
  Object.keys(ex).forEach(function(k){
    var pts=ex[k].pts,best=null,prev=0,isNew=false;
    pts.forEach(function(q){if(!best||q.v>best.v){prev=best?best.v:0;best=q;}});
    if(best){isNew=(fromIso(todayIso())-fromIso(best.d))/864e5<=7&&prev>0;
      out.push({name:ex[k].name,kg:best.v,date:best.d,prev:prev,isNew:isNew,n:pts.length});}
  });
  return out.sort(function(x,y){return y.kg-x.kg;});
}
function hasPR(p){
  var ex=exSessions(p),k,i;
  for(k in ex){var max=0;for(i=0;i<ex[k].pts.length;i++){var v=ex[k].pts[i].v;
    if(max>0&&v>max)return true;if(v>max)max=v;}}
  return false;
}
function radarAxes(p){
  var g=G(p),days=rangeIso(14),ws=workoutsRange(p,14);
  var stg=0,cd=0,mob=0,rest=0,stepsArr=[],sleepArr=[],nutArr=[],hydArr=[],sqArr=[];
  var byDate={};ws.forEach(function(w){byDate[w.date]=1;
    if(w.type==='strength')stg++;else if(w.type==='cardio'||w.type==='sport')cd++;else if(w.type==='mobility')mob++;});
  days.forEach(function(d){
    if(stretchDone(d,p)&&!workoutsOn(d,p).some(function(w){return w.type==='mobility';}))mob+=0.5;
    var e=ent(d,p);if(!logged(d,p))return;
    if(!byDate[d])rest++;
    stepsArr.push(Math.min(1,(e.steps||0)/g.steps));
    if(e.sleep)sleepArr.push(Math.min(1,e.sleep/g.sleep));
    if(e.sq)sqArr.push(e.sq/5);
    nutArr.push(0.6*Math.min(1,(e.prot||0)/g.prot)+0.4*Math.min(1,(e.veg||0)/g.veg));
    hydArr.push(Math.min(1,(e.w||0)/g.water));
  });
  return [
    {k:'Strength',v:Math.min(1,stg/4)},
    {k:'Cardio',v:Math.min(1,cd/3)},
    {k:'Mobility',v:Math.min(1,mob/4)},
    {k:'Activity',v:avgOf(stepsArr)||0},
    {k:'Sleep',v:avgOf(sleepArr)||0},
    {k:'Nutrition',v:avgOf(nutArr)||0},
    {k:'Hydration',v:avgOf(hydArr)||0},
    {k:'Recovery',v:Math.min(1,rest/3)*0.5+(avgOf(sqArr)||0.5)*0.5}
  ];
}
function periodStats(p,days){ /* days: array of iso */
  var g=G(p),scores=[],steps=[],sleep=[],waterHit=0,protHit=0,loggedN=0,wk=0,wkMin=0,kcal=0,waterArr=[],protArr=[];
  days.forEach(function(d){
    if(d>todayIso())return;
    var e=ent(d,p),ws=workoutsOn(d,p);
    wk+=ws.length?1:0;
    ws.forEach(function(x){wkMin+=x.min||0;kcal+=x.kcal||0;});
    if(!logged(d,p))return;
    loggedN++;
    var sc=score(d,p);if(sc!==null)scores.push(sc);
    steps.push(e.steps||0);
    if(e.sleep)sleep.push(e.sleep);
    waterArr.push(Math.min(1,(e.w||0)/g.water));protArr.push(Math.min(1,(e.prot||0)/g.prot));
    if((e.w||0)>=g.water)waterHit++;
    if((e.prot||0)>=g.prot)protHit++;
  });
  return {score:avgOf(scores),workouts:wk,wkMin:wkMin,kcal:kcal,steps:steps.reduce(function(a,x){return a+x;},0),
    stepsAvg:avgOf(steps),sleepAvg:avgOf(sleep),waterPct:loggedN?waterHit/loggedN:null,
    protPct:loggedN?protHit/loggedN:null,waterAvg:avgOf(waterArr),protAvg:avgOf(protArr),logged:loggedN};
}
function weekIsoDays(offsetWeeks){var mon=mondayOf(addDays(new Date(),-7*(offsetWeeks||0))),out=[],i;
  for(i=0;i<7;i++)out.push(iso(addDays(mon,i)));return out;}
function monthIsoDays(offsetMonths){
  var now=new Date(),m=new Date(now.getFullYear(),now.getMonth()-(offsetMonths||0),1);
  var out=[],d=new Date(m);
  while(d.getMonth()===m.getMonth()){out.push(iso(d));d=addDays(d,1);}
  return out;
}
function habitHitRates(p,days){
  var hs=habitsOf(p),out=[];
  hs.forEach(function(h){var hit=0,n=0;
    days.forEach(function(d){if(d>todayIso()||!logged(d,p))return;n++;
      if((ent(d,p).habits||{})[h.id])hit++;});
    if(n>=3)out.push({label:h.label,rate:hit/n,n:n});});
  return out.sort(function(x,y){return y.rate-x.rate;});
}

/* ---------- insights (coach) ---------- */
function insights(){
  var out=[];
  ['a','b'].forEach(function(p){
    var name=esc(pname(p)),g=G(p);
    var ws30=workoutsRange(p,30);
    /* muscle imbalance */
    var mc=muscleCounts(p,30),keys=MUSCLES.filter(function(k){return k!=='Full Body';}),tot=0;
    keys.forEach(function(k){tot+=mc[k];});
    if(tot>=4){
      var hi=keys.reduce(function(a,k){return mc[k]>mc[a]?k:a;});
      var majors=['Chest','Back','Shoulders','Legs','Glutes','Core'];
      var lo=majors.reduce(function(a,k){return mc[k]<mc[a]?k:a;});
      if(mc[hi]>=3&&mc[hi]-mc[lo]>=3&&hi!==lo)
        out.push({p:p,prio:1,txt:'🏋️ <b>'+name+'</b> has trained <b>'+hi+'</b> '+mc[hi]+'× in 30 days'+(mc[lo]?' but <b>'+lo+'</b> only '+mc[lo]+'×.':' and hasn’t touched <b>'+lo+'</b> at all.')});
    }
    /* lower body neglect */
    if(ws30.length>=3){
      var dsl=daysSinceWorkout(p,function(w){return (w.muscles||[]).some(function(m){return m==='Legs'||m==='Glutes';});});
      if(dsl===null&&ws30.some(function(w){return w.type==='strength';}))
        out.push({p:p,prio:1,txt:'🦵 <b>'+name+'</b> hasn’t logged a legs or glutes session yet — lower body is untouched.'});
      else if(dsl!==null&&dsl>=10)
        out.push({p:p,prio:1,txt:'🦵 <b>'+name+'</b>’s lower body has been neglected for <b>'+dsl+' days</b>.'});
    }
    /* mobility gap */
    var lastMob=null,d=new Date(),i;
    for(i=0;i<30;i++){if(stretchDone(iso(addDays(d,-i)),p)){lastMob=i;break;}}
    if(ws30.length>=3&&(lastMob===null||lastMob>=9))
      out.push({p:p,prio:2,txt:'🧘 <b>'+name+'</b> hasn’t logged a mobility or stretch session in '+(lastMob===null?'30+':lastMob)+' days.'});
    /* weekend drop */
    var wd=[],we=[];
    rangeIso(28).forEach(function(dd){if(!logged(dd,p))return;var e=ent(dd,p);if(!e.steps)return;
      var day=fromIso(dd).getDay();(day===0||day===6?we:wd).push(e.steps);});
    if(wd.length>=8&&we.length>=4){
      var aw=avgOf(wd),ae=avgOf(we);
      if(ae<aw*0.72)out.push({p:p,prio:2,txt:'📉 <b>'+name+'</b> averages '+num(Math.round(aw))+' steps on weekdays but only '+num(Math.round(ae))+' on weekends.'});
    }
    /* sleep trend (3 weeks) */
    var s1=[],s2=[];
    rangeIso(7).forEach(function(dd){var e=ent(dd,p);if(e.sleep)s1.push(e.sleep);});
    rangeIso(14,iso(addDays(new Date(),-7))).forEach(function(dd){var e=ent(dd,p);if(e.sleep)s2.push(e.sleep);});
    if(s1.length>=4&&s2.length>=6){
      var a1=avgOf(s1),a2=avgOf(s2),ch=(a1-a2)/a2;
      if(ch>=0.08)out.push({p:p,prio:2,txt:'😴 <b>'+name+'</b>’s sleep is up <b>'+pct(ch)+'</b> vs the previous two weeks ('+fmtH(a1)+' avg).'});
      else if(ch<=-0.08)out.push({p:p,prio:1,txt:'😴 <b>'+name+'</b>’s sleep is down <b>'+pct(-ch)+'</b> vs the previous two weeks ('+fmtH(a1)+' avg).'});
    }
    /* strength progression */
    var ex=exSessions(p),bestK=null,bestCh=0;
    Object.keys(ex).forEach(function(k){
      var pts=ex[k].pts.filter(function(q){return q.d>=iso(addDays(new Date(),-45));});
      if(pts.length>=3){var ch2=(pts[pts.length-1].v-pts[0].v)/pts[0].v;
        if(ch2>bestCh){bestCh=ch2;bestK=k;}}});
    if(bestK&&bestCh>=0.05)
      out.push({p:p,prio:2,txt:'📈 <b>'+name+'</b>’s '+esc(ex[bestK].name)+' is up <b>'+pct(bestCh)+'</b> over the last month ('+ex[bestK].pts[ex[bestK].pts.length-1].v+' kg).'});
  });
  /* couple: workouts fine, hydration missed */
  var wkDays=weekIsoDays(0).filter(function(d){return d<=todayIso();});
  var okW=0,okH=0,nboth=0;
  wkDays.forEach(function(d){
    if(logged(d,'a')&&logged(d,'b')){nboth++;
      if(workoutsOn(d,'a').length&&workoutsOn(d,'b').length)okW++;
      if((ent(d,'a').w||0)>=G('a').water&&(ent(d,'b').w||0)>=G('b').water)okH++;}});
  if(nboth>=4&&okW/nboth>=0.5&&okH/nboth<=0.35)
    out.push({p:'c',prio:1,txt:'💧 You’re both hitting workouts this week but missing hydration targets — '+okH+' of '+nboth+' days with both water goals met.'});
  /* couple score month vs month */
  var m0=avgOf(monthIsoDays(0).map(coupleScore)),m1=avgOf(monthIsoDays(1).map(coupleScore));
  if(m0!==null&&m1!==null&&monthIsoDays(1).filter(function(d){return coupleScore(d)!==null;}).length>=8){
    var chm=(m0-m1)/m1;
    if(Math.abs(chm)>=0.05)
      out.push({p:'c',prio:2,txt:'❤️ Your couple health score is '+(chm>0?'up':'down')+' <b>'+pct(Math.abs(chm))+'</b> vs last month ('+Math.round(m0)+' avg).'});
  }
  return out.sort(function(x,y){return x.prio-y.prio;});
}

function topBarPath(x,y,w,h,r){r=Math.min(r,h,w/2);if(h<=0)return '';
  return 'M'+x+','+(y+h)+' v'+(-(h-r))+' q0,'+(-r)+' '+r+','+(-r)+' h'+(w-2*r)+' q'+r+',0 '+r+','+r+' v'+(h-r)+' z';}
function ringSvg(pctv,colorVar,size,sw){
  sw=sw||8;var r=(size-sw-1)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,Math.max(0,pctv)));
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var('+colorVar+')" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
function groupedBars(daysN,valFn,goalFn,fmtFn,aria){

  [0.5,1].forEach(function(f){var y=padT+plotH*(1-f);

function linesChart(series,opts){
  /* series: [{p:'a'|'b', pts:[{d,v}], name}] */
  var W=opts.W||660,H=opts.H||180,padL=opts.padL||38,padT=12,padB=20,plotW=W-padL-14,plotH=H-padT-padB;
  var all=[];series.forEach(function(s){all=all.concat(s.pts.map(function(q){return q.v;}));});
  if(!all.length)return null;
  var lo=opts.yMin!==undefined?opts.yMin:Math.min.apply(null,all),hi=opts.yMax!==undefined?opts.yMax:Math.max.apply(null,all);
  if(hi===lo){hi+=1;lo-=1;}
  if(opts.pad){var sp=(hi-lo)*0.15;lo-=sp;hi+=sp;}
  var d0=opts.from,d1=opts.to||todayIso();
  var t0=fromIso(d0).getTime(),t1=fromIso(d1).getTime();if(t1<=t0)t1=t0+864e5;

  [0,0.5,1].forEach(function(f){var v=lo+(hi-lo)*f,y=Y(v);
    out+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'"/><text class="axis" x="'+(padL-5)+'" y="'+(y+4)+'" text-anchor="end">'+(opts.fmt?opts.fmt(v):Math.round(v))+'</text>';});
  series.forEach(function(s){

    var path=s.pts.map(function(q,j){return (j?'L':'M')+X(q.d).toFixed(1)+','+Y(q.v).toFixed(1);}).join(' ');
    out+='<path d="'+path+'" fill="none" stroke="var(--p'+s.p+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

    });

function radarSvg(){

  function pt(i,v){var ang=-Math.PI/2+i*2*Math.PI/n;return [(cx+Math.cos(ang)*R*v).toFixed(1),(cy+Math.sin(ang)*R*v).toFixed(1)];}

  for(var i=0;i<n;i++){var p1=pt(i,1);

function progressionCharts(){
  var cards=[],names={};
  ['a','b'].forEach(function(p){var ex=exSessions(p);Object.keys(ex).forEach(function(k){
    names[k]=names[k]||{name:ex[k].name,count:0};names[k].count+=ex[k].pts.length;});});
  var top=Object.keys(names).filter(function(k){return names[k].count>=2;})
    .sort(function(x,y){return names[y].count-names[x].count;}).slice(0,4);
  top.forEach(function(k){
    var series=[];
    ['a','b'].forEach(function(p){var ex=exSessions(p);
      if(ex[k]&&ex[k].pts.length>=2)series.push({p:p,pts:ex[k].pts.slice(-10),name:pname(p)+' · '+names[k].name});});
    if(!series.length)return;
    var from=series.reduce(function(a,s){return s.pts[0].d<a?s.pts[0].d:a;},todayIso());
    var chart=linesChart(series,{W:320,H:130,padL:34,from:from,pad:true,minW:260,fmt:function(v){return Math.round(v*10)/10;},aria:names[k].name+' progression',endLabels:true});
    if(chart)cards.push('<div class="card chartcard"><p class="charttitle">'+esc(names[k].name)+'</p><p class="chartsub">max weight per session (kg)</p>'+chart+'</div>');
  });
  return cards.length?'<div class="grid2">'+cards.join('')+'</div>':null;
}

function deltaHtml(cur,prev,fmtFn,invert){
  if(cur===null||prev===null||!prev)return '';
  var ch=(cur-prev)/Math.abs(prev);
  if(ch>1)ch=1;if(ch<-1)ch=-1;
  if(Math.abs(ch)<0.02)return '<span class="delta flat">→</span>';
  var up=ch>0,good=invert?!up:up;
  return '<span class="delta '+(good?'up':'down')+'">'+(up?'↑':'↓')+' '+pct(Math.abs(ch))+'</span>';
}
function weekReport(p){
  var cur=periodStats(p,weekIsoDays(0)),prev=periodStats(p,weekIsoDays(1)),g=G(p);
  var win=null,work=null;
  if(cur.workouts>=g.wpw)win='Completed '+cur.workouts+' workouts — weekly goal hit.';
  else if(prev.score&&cur.score&&cur.score>prev.score+3)win='Health score up '+Math.round(cur.score-prev.score)+' points on last week.';
  else if(prev.waterPct!==null&&cur.waterPct!==null&&cur.waterPct>prev.waterPct+0.15)win='Hydration consistency jumped to '+pct(cur.waterPct)+'.';
  else if(cur.workouts>prev.workouts)win=cur.workouts+' workouts — more than last week.';
  else if(cur.logged>=5)win='Checked in '+cur.logged+' days — consistency is the real win.';
  if(prev.sleepAvg&&cur.sleepAvg&&cur.sleepAvg<prev.sleepAvg-0.3)
    work='Average sleep dropped by '+Math.round((prev.sleepAvg-cur.sleepAvg)*60)+' minutes.';
  else if(prev.waterPct!==null&&cur.waterPct!==null&&cur.waterPct<prev.waterPct-0.15)
    work='Hydration slipped to '+pct(cur.waterPct)+' of days.';
  else if(prev.workouts>0&&cur.workouts<prev.workouts-1)
    work='Workouts down from '+prev.workouts+' to '+cur.workouts+'.';
  else if(cur.protPct!==null&&cur.protPct<0.5)
    work='Protein target met on only '+pct(cur.protPct)+' of days.';
  var gap=null;
  var mc=muscleCounts(p,30),tot=0;MUSCLES.forEach(function(k){tot+=mc[k];});
  if(tot>=4){
    var legs=(mc.Legs||0)+(mc.Glutes||0);
    if(legs<=1)gap='Leg training frequency is low ('+legs+' lower-body session'+(legs===1?'':'s')+' in 30 days).';
  }
  var next=[];
  if(gap)next.push('2 lower-body sessions');
  if(cur.sleepAvg&&cur.sleepAvg<g.sleep)next.push(fmtH(g.sleep)+'+ sleep per night');
  if(cur.waterPct!==null&&cur.waterPct<0.9)next.push('90%+ hydration consistency');
  if(cur.workouts<g.wpw)next.push(g.wpw+' workouts');
  if(!next.length)next.push('Keep everything exactly as it is');
  return {cur:cur,prev:prev,win:win,work:work,gap:gap,next:next.slice(0,3)};
}

function goalMetricCur(g){
  var p=g.p;
  if(g.metric==='weight'){var ms=measuresOf(p).filter(function(m){return m.weight>0;});return ms.length?ms[ms.length-1].weight:null;}
  if(g.metric==='waist'){var ms2=measuresOf(p).filter(function(m){return m.waist>0;});return ms2.length?ms2[ms2.length-1].waist:null;}
  if(g.metric==='wpw'){var n=0;rangeIso(28).forEach(function(d){if(workoutsOn(d,p).length)n++;});return Math.round(n/4*10)/10;}
  if(g.metric==='steps'){return avgOf(rangeIso(7).map(function(d){var e=ent(d,p);return logged(d,p)?(e.steps||0):null;}));}
  if(g.metric==='sleep'){return avgOf(rangeIso(7).map(function(d){var e=ent(d,p);return e.sleep||null;}));}
  return g.cur!==undefined?g.cur:null;
}

/* ---------- sample data ---------- */
function loadSample(){
  var seed=131;function rnd(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;}
  silentAch=true;
  mut(function(){
    S.sample=1;
    var i,benchN=0,now=Date.now();
    for(i=28;i>=1;i--){
      var d=iso(addDays(new Date(),-i)),dt=fromIso(d),dow=dt.getDay(),prog=(28-i)/28;
      S.days[d]=S.days[d]||{};
      /* --- Neil (a): weekday-heavy, legs neglected, hydration patchy, no recent stretching --- */
      var aTrain=(dow>=1&&dow<=5)?rnd()<0.8:rnd()<0.3;
      if(aTrain){
        var rot=['push','pull','shoulders'][Math.floor(rnd()*3)];
        var muscles=rot==='push'?['Chest','Triceps']:rot==='pull'?['Back','Biceps']:['Shoulders','Core'];
        var ex=[];
        if(rot==='push'){benchN++;ex.push({n:'Bench press',s:4,r:8,kg:60+Math.floor(benchN/1.5)*2.5});ex.push({n:'Incline DB press',s:3,r:10,kg:22+Math.floor(benchN/2)*2});}
        if(rot==='pull'){ex.push({n:'Barbell row',s:4,r:8,kg:55+Math.floor(prog*10/2.5)*2.5});ex.push({n:'Lat pulldown',s:3,r:10,kg:50+Math.floor(prog*8/2.5)*2.5});}
        if(rot==='shoulders')ex.push({n:'Overhead press',s:4,r:8,kg:35+Math.floor(prog*5/2.5)*2.5});
        if(i===25){muscles=['Legs','Glutes'];ex=[{n:'Squat',s:4,r:8,kg:80}];}
        S.workouts.push({id:'sw-a-'+i,p:'a',date:d,type:'strength',loc:'gym',min:45+15*Math.floor(rnd()*3),int:2+(rnd()<0.4?1:0),muscles:muscles,exercises:ex,kcal:250+Math.round(rnd()*150),c:now-i*10,t:now-i*10});
      }else if(dow===6&&rnd()<0.5){
        S.workouts.push({id:'sw-a-'+i,p:'a',date:d,type:'cardio',loc:'outdoor',min:30,int:2,muscles:[],exercises:[],kcal:280,c:now-i*10,t:now-i*10});
      }
      var aHab={};
      if(rnd()<0.75)aHab.ha1=1;
      if(i>12&&rnd()<0.6)aHab.ha2=1; /* stretching stops 12 days ago */
      if(rnd()<0.6)aHab.ha3=1;if(rnd()<0.8)aHab.ha4=1;if(rnd()<0.5)aHab.ha5=1;if(rnd()<0.5)aHab.ha6=1;
      S.days[d].a={w:(rnd()<0.45?2500:1500)+Math.round(rnd()*500),
        sleep:Math.round((6.6+rnd()*1.6)*4)/4,sq:2+Math.floor(rnd()*3),
        steps:(dow===0||dow===6)?4500+Math.round(rnd()*1500):8800+Math.round(rnd()*2500),
        active:20+Math.round(rnd()*40),prot:95+Math.round(rnd()*50),veg:1+Math.floor(rnd()*4),
        mood:2+Math.floor(rnd()*3),habits:aHab,t:now-i*10};
      /* --- Rachna (b): balanced, sleep improving, yoga regular --- */
      var bType=null;
      if(dow===2||dow===4)bType='strength';
      else if((dow===1||dow===5)&&rnd()<0.8)bType='mobility';
      else if(dow===6&&rnd()<0.6)bType='cardio';
      if(bType){
        var bm=bType==='strength'?(rnd()<0.5?['Legs','Glutes']:['Full Body']):[];
        var bex=bType==='strength'?[{n:'Goblet squat',s:3,r:12,kg:14+Math.floor(prog*6/2)*2},{n:'Hip thrust',s:3,r:10,kg:40+Math.floor(prog*20/5)*5}]:[];
        S.workouts.push({id:'sw-b-'+i,p:'b',date:d,type:bType,loc:bType==='mobility'?'home':(bType==='cardio'?'outdoor':'gym'),min:bType==='mobility'?25:45,int:bType==='mobility'?1:2,muscles:bm,exercises:bex,kcal:bType==='cardio'?240:160,c:now-i*10,t:now-i*10});
      }
      var bHab={};
      if(rnd()<0.8)bHab.hb1=1;if(rnd()<0.7)bHab.hb2=1;if(rnd()<0.7)bHab.hb3=1;if(rnd()<0.9)bHab.hb4=1;if(rnd()<0.6)bHab.hb5=1;if(rnd()<0.55)bHab.hb6=1;
      S.days[d].b={w:(rnd()<0.7?2200:1600)+Math.round(rnd()*400),
        sleep:Math.round((6.4+prog*1.4+rnd()*0.8)*4)/4,sq:2+Math.floor(rnd()*3+prog),
        steps:7200+Math.round(rnd()*2800),active:25+Math.round(rnd()*35),
        prot:70+Math.round(rnd()*45),veg:2+Math.floor(rnd()*3),
        mood:2+Math.floor(rnd()*3),habits:bHab,t:now-i*10};
      /* weekly measurements */
      if(i%7===1){
        S.measure.push({id:'a_'+d,p:'a',date:d,weight:Math.round((80.6-prog*0.9+rnd()*0.3)*10)/10,waist:Math.round((88-prog*1.2)*10)/10,c:now-i*10,t:now-i*10});
        S.measure.push({id:'b_'+d,p:'b',date:d,weight:Math.round((62.4-prog*0.5+rnd()*0.2)*10)/10,c:now-i*10,t:now-i*10});
      }
    }
    /* one sample goal each */
    S.goals.push({id:'sg-a',p:'a',title:'Bench press 80kg',metric:'manual',startVal:60,cur:72.5,target:80,due:iso(addDays(new Date(),60)),start:iso(addDays(new Date(),-28)),c:now,t:now});
    S.goals.push({id:'sg-b',p:'b',title:'8k steps every day',metric:'steps',startVal:7000,target:8000,due:iso(addDays(new Date(),30)),start:iso(addDays(new Date(),-28)),c:now,t:now});
  });
  silentAch=false;
}

var HOUSE=(function(){
  var m=(location.hash||'').match(/h=([A-Za-z0-9]{24,64})/);
  if(m){try{localStorage.setItem('ft-household',m[1]);}catch(e){}}
  try{return localStorage.getItem('ft-household')||(m?m[1]:null);}catch(e){return m?m[1]:null;}
})();
var REV=0,syncing=false,dirty=false;
function setSave(mode){saveMode=mode;
  var chip=document.getElementById('savechip');
  if(chip){var tmp=document.createElement('div');tmp.innerHTML=saveChipHtml();chip.replaceWith(tmp.firstChild);}}
function rpc(fn,body){
  return fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',headers:{
    'apikey':SKEY,'Authorization':'Bearer '+SKEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(function(r){
      if(!r.ok)throw new Error('http '+r.status);
      var ct=r.headers.get('content-type')||'';
      return ct.indexOf('json')>=0?r.json():null;});
}
function schedulePublish(){dirty=true;if(pubTimer)clearTimeout(pubTimer);pubTimer=setTimeout(doSave,1800);}
function doSave(){
  pubTimer=null;
  if(!HOUSE){setSave('local');return;}
  if(syncing){schedulePublish();return;}
  syncing=true;dirty=false;setSave('saving');
  rpc('ft_put_doc',{h:HOUSE,d:S,expected_rev:REV}).then(function(res){
    syncing=false;
    if(res&&res.ok){REV=res.rev;setSave('saved');if(dirty)schedulePublish();}
    else if(res&&res.err==='conflict'&&res.doc){
      S=mergeStates(res.doc,S);REV=res.rev;persistLocal();render();
      pubTimer=setTimeout(doSave,400);
    }else{setSave('offline');pubTimer=setTimeout(doSave,15000);}
  },function(){syncing=false;setSave('offline');pubTimer=setTimeout(doSave,12000);});
}
function pullRemote(){
  if(!HOUSE||syncing||dirty)return;
  rpc('ft_get_doc',{h:HOUSE}).then(function(res){
    if(!res||!res.doc)return;
    if(res.rev===REV)return;
    var before=stableStr(S);
    S=mergeStates(res.doc,S);REV=res.rev;persistLocal();
    if(stableStr(S)!==before)render();
    if(stableStr(S)!==stableStr(res.doc))schedulePublish();else setSave('saved');
  },function(){});
}
function init(){
  try{
    var local=JSON.parse(localStorage.getItem(LS)||'null');
    if(local&&local.v===S.v)S=mergeStates(S,local);
  }catch(e){}
  silentAch=true;checkAch();silentAch=false;
  persistLocal();
  render();
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
  if(!HOUSE){setSave('local');return;}
  setSave('boot');
  rpc('ft_get_doc',{h:HOUSE}).then(function(res){
    if(res&&res.doc){
      S=mergeStates(res.doc,S);REV=res.rev;persistLocal();render();
      if(stableStr(S)!==stableStr(res.doc))schedulePublish();else setSave('saved');
    }else{schedulePublish();}
  },function(){setSave('offline');pubTimer=setTimeout(doSave,10000);});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')pullRemote();
    else if(pubTimer){clearTimeout(pubTimer);doSave();}
  });
  setInterval(function(){if(document.visibilityState==='visible')pullRemote();},45000);
}
init();
})();
